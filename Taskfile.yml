# https://taskfile.dev

version: '3'

vars:
  GREETING: Hello, World!

tasks:
  default:
    cmds:
      - echo "{{.GREETING}}"
    silent: true

  win-build:
    cmds:
      - echo "Packaging windows executable"
      - cp -r data build/
      - /usr/bin/flatpak run org.godotengine.Godot --command=godot --headless --export-release "Windows Desktop" ./build/Praedor_Chargen.exe
      - ark --add-to ./build/Praedor_Chargen_Win.zip ./build/Praedor_Chargen.exe ./build/data
      - rm -r build/data
  
  lin-build:
    cmds:
      - echo "Packaging linux executable"
      - cp -r data build/
      - /usr/bin/flatpak run org.godotengine.Godot --command=godot --headless --export-release "Linux" ./build/Praedor_Chargen.bin.x86_64
      - ark --add-to ./build/Praedor_Chargen_Lin.zip ./build/Praedor_Chargen.bin.x86_64 ./build/data
      - rm -r build/data

  clean:
    cmds: 
      - rm -r build/*
